image:
  repository: ror2-unofficial-dedicated-server
  tag: local
  pullPolicy: IfNotPresent

game:
  # A read-only PVC containing the Windows game's files, including Risk of Rain 2.exe.
  existingClaim: ""

server:
  port: 7777
  maxPlayers: 4
  gameOverReturnDelaySeconds: 20

service:
  type: NodePort
  nodePort: 30777

resources:
  requests:
    cpu: 1000m
    memory: 3Gi
  limits:
    cpu: "4"
    memory: 6Gi

# Only list server-side mods compatible with unmodified clients.
# Each entry is a mod ZIP and its dependencies, with a pinned SHA-256.
# A ZIP containing BepInEx/ overlays that tree. Other ZIPs go to plugins/<name>.
mods: []
#  - name: ExampleServerSideMod
#    url: https://example.invalid/ExampleServerSideMod.zip
#    sha256: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
